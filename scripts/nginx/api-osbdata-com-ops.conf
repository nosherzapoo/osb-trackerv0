# Add this location block inside the existing api.osbdata.com server { }
# stanza on the VPS (likely /etc/nginx/sites-available/api.osbdata.com).
#
# Reload with:  nginx -t && systemctl reload nginx

location /ops/ {
    # Strip /ops prefix when proxying to FastAPI (which mounts paths at root).
    rewrite ^/ops/(.*)$ /$1 break;

    proxy_pass http://127.0.0.1:8001;
    proxy_http_version 1.1;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_read_timeout 60s;
    proxy_connect_timeout 5s;

    # Auth/CORS handled by FastAPI; pass through unchanged.
    proxy_pass_header Authorization;
}
